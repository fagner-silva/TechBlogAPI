version: '3.8'

services:
  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build: .
    container_name: techblog-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI_DOCKER=mongodb://mongo:27017/techblog
      - JWT_SECRET=dcb6cfde3baf7f45234cae4d986c664dcc86471f6863fda8dfd2c2c58d7e306b7237e5c6ab2223653c334c96f76a7dd8f39bca4012fd6bdac6d855e45d80d0d
    depends_on:
      - mongo

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana

volumes:
  mongo-data:
  grafana-storage:
