name: Run Tests (CI)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'" 
          --health-interval=10s 
          --health-timeout=5s 
          --health-retries=5

    env:
      PORT: 3000
      MONGO_URI_PROD: ${{ secrets.MONGO_URI_PROD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name:  Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Garantir permissão de execução para jest
        run: chmod +x ./node_modules/.bin/jest

      - name: Rodar testes com cobertura
        run: |
          npx jest --coverage --coverageReporters=text-summary > coverage.txt
          cat coverage.txt

      - name: Verificar cobertura mínima
        run: |
          COVERAGE=$(grep -Po 'All files[^|]*\|\s*\K\d+' coverage.txt | head -1)
          echo "Cobertura total: $COVERAGE%"
          if [ "$COVERAGE" -lt 20 ]; then
            echo "❌ Cobertura abaixo de 20%"
            exit 1
          else
            echo "✅ Cobertura aceitável"
          fi
      - name: Run mutation tests
        run: npx stryker run