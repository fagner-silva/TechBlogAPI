services:
  - type: web
    name: techblog-api
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        fromSecret: JWT_SECRET
      - key: MONGO_URI_PROD
        fromSecret: MONGO_URI_PROD

  - type: web
    name: prometheus
    env: docker
    dockerfilePath: infra/prometheus/Dockerfile
    plan: free

  - type: web
    name: grafana
    env: docker
    dockerfilePath: infra/grafana/Dockerfile
    plan: free
    envVars:
      - key: GF_SECURITY_ADMIN_USER
        value: admin
      - key: GF_SECURITY_ADMIN_PASSWORD
        value: admin
